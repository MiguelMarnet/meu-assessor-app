<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#221913">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="paleta-sereno.css">
<title>Protótipo · falar com o Assessor</title>
<style>
  /* PROTÓTIPO — não está ligado a nada do app.
     A voz de SAÍDA foi removida: ela usava a voz do sistema operacional, que é
     loteria (nesta máquina só havia vozes em inglês, então o português saía com
     sotaque americano). Num produto que vende calor humano, voz robótica com
     sotaque errado é pior que nenhuma voz.
     A ENTRADA por voz ficou: ela usa outra tecnologia, funciona bem, e é o que
     de fato tira atrito — falar é mais rápido que digitar. */
  :root{--card:var(--panel);--muted:var(--ink-soft);--r:18px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);
       line-height:1.5;-webkit-font-smoothing:antialiased}
  .tela{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
        padding:30px 20px;text-align:center}
  .caixa{width:100%;max-width:400px}

  /* O sol vem da paleta (.sol) — mesma definição do login e do "conectando". */
  .sol{margin:0 auto 22px;transition:transform .35s ease, box-shadow .35s ease}
  .sol.ouvindo{animation:sol-ouve 1.1s ease-in-out infinite}
  @keyframes sol-ouve{
    0%,100%{box-shadow:0 20px 50px color-mix(in srgb,var(--nucleo-baixo) 34%,transparent),
                       0 0 0 0 color-mix(in srgb,var(--nucleo-alto) 45%,transparent)}
    70%    {box-shadow:0 20px 50px color-mix(in srgb,var(--nucleo-baixo) 34%,transparent),
                       0 0 0 26px transparent}}
  @media (prefers-reduced-motion: reduce){ .sol.ouvindo{animation:none} }

  .eyebrow{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.18em;
           text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin-bottom:8px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:22px;min-height:42px}

  button{font-family:inherit;font-size:15px;font-weight:600;border-radius:var(--r);
         min-height:56px;width:100%;cursor:pointer;transition:.15s;border:1.5px solid var(--line);
         background:var(--card);color:var(--ink);user-select:none;-webkit-user-select:none}
  button:hover{border-color:var(--acento)}
  button:active{transform:scale(.99)}
  button.gravando{background:var(--alerta);color:#fff;border-color:transparent}

  .conversa{margin-top:22px;text-align:left;display:flex;flex-direction:column;gap:8px}
  .bolha{padding:11px 14px;border-radius:14px;font-size:14px;max-width:88%}
  .bolha.eu{background:var(--acento-soft);align-self:flex-end}
  .bolha.ela{background:var(--card);border:1px solid var(--line);align-self:flex-start}
  .bolha .quem{display:block;font-size:10.5px;color:var(--muted);margin-bottom:3px}

  .aviso{margin-top:22px;font-size:12.5px;color:var(--muted);line-height:1.6;
         border-top:1px solid var(--line);padding-top:16px;text-align:left}
  .aviso b{color:var(--ink)}
</style>
</head>
<body>
<main class="tela">
  <div class="caixa">
    <div class="sol sol-p" id="sol"></div>
    <div class="eyebrow">Protótipo</div>
    <h1>Fala com o Assessor</h1>
    <p class="sub" id="sub">Segura o botão e fala do seu jeito. Ele transcreve e responde por escrito.</p>

    <button id="btnFalar">🎙️ Segurar para falar</button>

    <div class="conversa" id="conversa"></div>
    <div class="aviso" id="aviso"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const sol = $('sol');
const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, ouvindo = false;

function bolha(quem, texto, classe) {
  const d = document.createElement('div');
  d.className = 'bolha ' + classe;
  d.innerHTML = '<span class="quem">' + quem + '</span>' + texto;
  $('conversa').appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

/* Resposta local, só para sentir o ritmo. No app de verdade este texto vai
   para o MESMO fluxo do n8n que já entende suas mensagens do WhatsApp — o
   cérebro existe, não se constrói outro. */
function responder(texto) {
  const t = texto.toLowerCase();
  let r;
  if (/gast|paguei|comprei|almoç|mercado|\d+\s*(reais|conto)/.test(t)) r = 'Anotei o gasto e já categorizei. Quer ver o resumo do mês?';
  else if (/reuni|amanhã|hoje|segunda|terça|quarta|quinta|sexta|\d+h/.test(t)) r = 'Coloquei na sua agenda. Te aviso trinta minutos antes.';
  else if (/lembr|pagar|vencimento|dia \d+/.test(t)) r = 'Virou tarefa com prazo. Não deixo passar.';
  else if (/saldo|quanto|resumo|extrato/.test(t)) r = 'Neste mês você gastou menos que no anterior. Quer o detalhe por categoria?';
  else r = 'Entendi. No app de verdade isso vai para o mesmo cérebro que já responde no seu WhatsApp.';
  bolha('Assessor', r, 'ela');
}

function pararDeOuvir() {
  ouvindo = false;
  sol.classList.remove('ouvindo');
  $('btnFalar').classList.remove('gravando');
  $('btnFalar').textContent = '🎙️ Segurar para falar';
  if (rec) { try { rec.stop(); } catch (e) {} }
}

function comecarAOuvir() {
  if (!Rec) return;
  rec = new Rec();
  rec.lang = 'pt-BR';
  rec.interimResults = true;   // mostra a transcrição enquanto fala
  rec.continuous = false;
  let ultimo = '';
  rec.onresult = ev => {
    ultimo = [...ev.results].map(r => r[0].transcript).join('');
    $('sub').textContent = '“' + ultimo + '”';
  };
  rec.onerror = ev => {
    pararDeOuvir();
    $('sub').textContent = ev.error === 'not-allowed'
      ? 'Você precisa permitir o microfone para testar.'
      : 'Não consegui ouvir agora (' + ev.error + ').';
  };
  rec.onend = () => {
    pararDeOuvir();
    if (ultimo.trim()) {
      bolha('Você', ultimo, 'eu');
      $('sub').textContent = 'Segura o botão e fala do seu jeito.';
      responder(ultimo);
    }
  };
  ouvindo = true;
  sol.classList.add('ouvindo');
  $('btnFalar').classList.add('gravando');
  $('btnFalar').textContent = '● Ouvindo… solta pra enviar';
  $('sub').textContent = 'Pode falar.';
  rec.start();
}

const b = $('btnFalar');
['mousedown', 'touchstart'].forEach(ev => b.addEventListener(ev, e => { e.preventDefault(); if (!ouvindo) comecarAOuvir(); }));
['mouseup', 'mouseleave', 'touchend'].forEach(ev => b.addEventListener(ev, () => { if (ouvindo) pararDeOuvir(); }));

(function diagnostico() {
  const linhas = [];
  if (Rec) {
    linhas.push('<b>Este navegador ouve.</b> Segura o botão e testa.');
  } else {
    linhas.push('<b>Este navegador não tem reconhecimento de voz.</b> Funciona em Chrome, Edge e Safari 14.5+ (iPhone incluído); no Firefox, não.');
    b.disabled = true;
  }
  linhas.push('<br>A voz de <b>saída</b> foi removida de propósito: ela usa a voz do sistema, que varia de aparelho pra aparelho — nesta máquina só havia vozes em inglês. Ele responde por escrito.');
  $('aviso').innerHTML = linhas.join('<br>');
})();
</script>
</body>
</html>
